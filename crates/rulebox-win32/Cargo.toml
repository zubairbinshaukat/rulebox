[package]
name = "rulebox-win32"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# (Phase 6 Step 5, plan 4.11) Opens the production door of `guard::require_armed_machine`
# in a release build on an installed PC. Turned on only by the release workflow
# (`--features production`); never a default, never set by `cargo build`, `cargo test` or
# `pnpm dev:staff`. A test in `tests/guard_coverage.rs` keeps it out of every default.
production = []

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# `net` only for the safe named-pipe constructors in `pipe.rs` (keeps `unsafe` in this crate).
tokio = { workspace = true, features = ["net"] }
windows = { workspace = true, features = [
    # RtlGetVersion (osinfo.rs); not in the plan's feature list, which missed it.
    "Wdk_System_SystemServices",
    # (Phase 4 Step 16 review) NtCreateFile relative to a held folder handle (tree.rs).
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    # (Phase 5 Step 3) PRINTER_INFO_2W holds a DEVMODEW (printing.rs).
    "Win32_Graphics_Gdi",
    # (Phase 5 Step 3) printing.rs, service.rs, wlan.rs, eventlog.rs.
    "Win32_Graphics_Printing",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # (Phase 5 Step 8) fileid.rs: who signed a program file (WinVerifyTrust, catalog lookup).
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # (Phase 5 Step 8) etw.rs: the process-start trace session (EVENT_TRACE_LOGFILEW needs Time).
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    # (Phase 4 Step 14 review) The installer's kill-on-close job (job.rs).
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # (Phase 5 Step 5) wmi.rs: a read-only WMI query for BitLocker and the TPM.
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    # (Phase 6 Step 8) security::relaunch_setup_elevated: ShellExecuteExW takes SW_SHOWNORMAL.
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
