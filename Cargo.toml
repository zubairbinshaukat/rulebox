[workspace]
resolver = "2"
members = ["apps/agent", "apps/shell-launcher", "apps/staff-app/src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
rulebox-policy = { path = "crates/rulebox-policy" }
rulebox-ipc = { path = "crates/rulebox-ipc" }
rulebox-win32 = { path = "crates/rulebox-win32" }
rulebox-desktop = { path = "crates/rulebox-desktop" }

# Phase 2 (versions checked with `cargo search` on 2026-10-13)
windows = "0.62"
windows-service = "0.8.1"
tokio = { version = "~1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
convex = "0.10.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
bytes = "1.12.1"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
# (1.1) Argon2id for the exit PIN and the offline sign-in cache (plan 4.4)
argon2 = "0.6.0"

# Phase 3 Staff App / rulebox-desktop (versions checked 2026-10-13)
tauri = "2.12.3"
# Versioning is independent of `tauri` (tauri 2.12.3 builds with 2.7.2).
tauri-build = "2.7.2"
tauri-plugin-single-instance = "2.5.3"
webview2-com = "0.39.1"
cap-std = "4.0.3"
walkdir = "2.5.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
infer = "0.22.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
csv = "1.4.0"
dunce = "1.0.5"
png = "0.18.1"
zip = "9.0.2"
url = "2.5.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"   # keeps target/ small (see CLAUDE.md)

# Argon2 is far too slow unoptimized (plan 4.4): a debug-build check could outlast the
# 10-second IPC timeout. Dependencies only; our own code stays in the normal dev profile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
