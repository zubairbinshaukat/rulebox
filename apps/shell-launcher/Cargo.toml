[package]
name = "rulebox-shell"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# `rulebox-shell.exe`: the registered shell. Starts and relaunches the Staff App,
# shows a native fallback screen, and (1.1) carries the hidden-exit PIN to the agent.
# One of the two places in this phase that may import `windows::` (plan 4.2).
# No WebView, no network. tokio comes in only through `rulebox-ipc`'s `call_once`.

[dependencies]
rulebox-win32.workspace = true
rulebox-ipc = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
