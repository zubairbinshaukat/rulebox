[package]
name = "rulebox-agent"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# (Phase 6 Step 5) Forwards to the production door of the machine guard; only the release
# workflow sets it (never a default).
production = ["rulebox-win32/production"]

[dependencies]
rulebox-ipc = { workspace = true, features = ["client", "server"] }
rulebox-policy.workspace = true
rulebox-win32.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
# (Phase 4 Step 14) The chunk type of reqwest's byte stream.
bytes.workspace = true
clap.workspace = true
convex.workspace = true
getrandom.workspace = true
# (Phase 5 Step 13) The device sealing key (X25519) and zeroized passphrase buffers.
x25519-dalek.workspace = true
zeroize.workspace = true
# (Phase 4 Step 14) Installer and icon downloads, `https://` only.
reqwest.workspace = true
sha2.workspace = true
# (Phase 5 Step 14b) Unpacks driver zips (installs/unzip.rs).
zip.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
windows-service.workspace = true
# (Phase 6 Step 8) Rulebox Setup's native window, `setup/ui.rs` only (plan 4.10.1: the launcher's
# Win32 toolkit, no WebView). Every other Win32 call stays in rulebox-win32.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# (Phase 5 Step 6) build.rs hashes the embedded App Control binaries.
sha2.workspace = true

[dev-dependencies]
# Pause the clock in the hello-deadline test; raw pipe client for protocol tests.
tokio = { workspace = true, features = ["test-util", "io-util"] }
tokio-util = { workspace = true, features = ["codec"] }
futures-util = { workspace = true, features = ["sink"] }
# (Phase 4 Step 9) Signs test documents like the server does.
ed25519-dalek.workspace = true
# (Phase 5 Step 13) Seals test passphrases for the Wi-Fi tests the way the server does.
hkdf.workspace = true
chacha20poly1305.workspace = true

[lints]
workspace = true

