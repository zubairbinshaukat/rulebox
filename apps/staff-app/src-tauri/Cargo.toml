[package]
name = "rulebox-staff"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "rulebox_staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Lib / integration test harnesses exit with STATUS_ENTRYPOINT_NOT_FOUND
# (0xC0000139) on this Windows + Tauri link. Step 3 tests live on the bin
# (`src/main.rs` `#[cfg(test)]`).
test = false
doctest = false

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
tauri-plugin-single-instance.workspace = true
rulebox-desktop.workspace = true
rulebox-ipc = { workspace = true, features = ["client"] }
rulebox-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
futures-util = { workspace = true }
cap-std.workspace = true
walkdir.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
infer.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
csv.workspace = true
dunce.workspace = true
png.workspace = true
zip.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows = { workspace = true, features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
